<!doctype html>
<html lang="en">
  <head>
    <title>Edit Club</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="../style.css">
    <script src="edit_club.js" defer></script>
  </head>
  <body>
    <nav class="lns_nav">
      <div class="nav-wrapper">
        <a href="../index.html" class="brand-logo"><img src="https://resources.finalsite.net/images/f_auto,q_auto,t_image_size_2/v1786973953/knoxschoolsorg/xvau4g2abw9zti617eco/LNSTEMColor3x.png" alt="L&amp;N STEM logo"><span>L&amp;N STEM</span></a>
        <ul class="right">
          <li><a href="../index.html">Home</a></li>
                    <li><a href="../students/students.html">Students</a></li>
        </ul>
      </div>
    </nav>
    <main>
      <a href="../index.html" class="back_link"><span aria-hidden="true">&larr;</span> Back to clubs</a>
      <h1>Edit club</h1>
      <form id="club_form" class="club_form">
        <label for="name">Club name</label>
        <input id="name" name="name" type="text" class="browser-default" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5" class="browser-default" required></textarea>

        <label for="thumbnail">Image URL</label>
        <input id="thumbnail" name="thumbnail" type="url" class="browser-default">

        <label for="user_select">Members</label>
        <ul id="member_list" class="member_list"></ul>
        <div class="add_user_row">
          <select id="user_select" class="browser-default"></select>
          <button type="button" id="add_user_button">Add user</button>
        </div>

        <button type="submit">Save</button>
        <button type="button" id="delete_button" class="delete_button">Delete</button>
      </form>
    </main>
  </body>
</html>
