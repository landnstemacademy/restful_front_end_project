            <form id="student_form" class="club_form">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" class="browser-default" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" class="browser-default" required>

        <label for="avatar">Avatar URL (optional)</label>

        <button type="submit">Add student</button>
      </form>
